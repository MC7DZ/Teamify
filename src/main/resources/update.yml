# =====================================================================
#                    Teamify Update Notifier
# =====================================================================
#
# Notify OPs and players with the "teamify.admin" permission in chat
# when they join, if a newer version was found on the last check.
notify-ops: true

# Automatically check for a new version when the server starts (runs
# asynchronously, does not lag the server).
auto-check-updates: true

# =====================================================================
# DO NOT TOUCH "current-version" BELOW.
# =====================================================================
# What this does: the plugin compares this value against the
# "version" field from your JSON file to figure out whether an
# update is available. It is NOT a setting - it's just the running
# plugin's own version number, and Teamify keeps it in sync
# automatically every time it starts. Editing it by hand doesn't
# change what version you're running; it will only make the update
# notifier compare against the wrong number and give you wrong
# "update available" messages (false positives or false negatives).
current-version: "1.0.0"
